<meta charset="utf-8">
<title>Помічник служби підтримки — ПР3</title>
<style>
  :root { color-scheme: light dark; }
  body { max-width: 44rem; margin: 3rem auto; padding: 0 1.25rem;
         font: 16px/1.55 system-ui, sans-serif; }
  h1 { font-size: 1.4rem; margin-bottom: .25rem; }
  p.lead { margin-top: 0; opacity: .75; }
  textarea { width: 100%; min-height: 7rem; padding: .6rem .7rem; font: inherit;
             border: 1px solid #8886; border-radius: .4rem; resize: vertical; }
  button { margin-top: .75rem; padding: .5rem 1.1rem; font: inherit;
           border: 0; border-radius: .4rem; background: #2563eb; color: #fff; cursor: pointer; }
  button[disabled] { opacity: .55; cursor: default; }
  #answer { margin-top: 1.5rem; padding: 1rem; border: 1px solid #8886;
            border-radius: .4rem; white-space: pre-wrap; }
  #answer:empty { display: none; }
  #answer { overflow-wrap: anywhere; line-height: 1.6; }
  #answer h2, #answer h3 { margin: .9em 0 .25em; }
  #answer p { margin: .4em 0 .8em; }
  #answer ul, #answer ol { padding-left: 1.5rem; }
  #answer li { margin: .25em 0; }
  #answer code { padding: .08em .3em; background: #8882; border-radius: .2rem; }
  #answer.error { border-color: #dc2626; white-space: pre-wrap; }
  .meta { margin-top: .6rem; font-size: .85rem; opacity: .7; }
  .error { border-color: #dc2626; }
</style>

<h1>Помічник служби підтримки</h1>
<p class="lead">Відповідає на підставі правил магазину з файлу <code>context.md</code>.</p>

<form id="form">
  <textarea id="question" placeholder="Замовив навушники три дні тому, хочу повернути. Чи можна?" required></textarea>
  <button type="submit">Запитати</button>
</form>

<div id="answer"></div>
<div class="meta" id="meta"></div>

<script>
  // Безпечне локальне відображення базового Markdown без сторонніх бібліотек.
  // Спочатку екрануємо HTML, а потім обробляємо лише дозволену розмітку.
  function escapeHtml(value) {
    return value.replace(/&/g, '&amp;').replace(/</g, '&lt;')
      .replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
  }
  function inlineMarkdown(value) {
    return escapeHtml(value)
      .replace(/\*\*(.+?)\*\*/g, '<strong>$1</strong>')
      .replace(/(?<!\*)\*([^*\n]+)\*(?!\*)/g, '<em>$1</em>')
      .replace(/`([^`]+)`/g, '<code>$1</code>');
  }
  function renderMarkdown(value) {
    const lines = value.replace(/\r\n/g, '\n').split('\n');
    let html = '', list = null;
    function closeList() { if (list) { html += `</${list}>`; list = null; } }
    for (const line of lines) {
      const trimmed = line.trim();
      if (!trimmed) { closeList(); continue; }
      const heading = /^(#{1,3})\s+(.+)$/.exec(trimmed);
      const item = /^(?:[-*]\s+|\d+\.\s+)(.+)$/.exec(trimmed);
      if (heading) {
        closeList();
        const level = Math.min(heading[1].length + 1, 4);
        html += `<h${level}>${inlineMarkdown(heading[2])}</h${level}>`;
      } else if (item) {
        const kind = /^\d+\./.test(trimmed) ? 'ol' : 'ul';
        if (list !== kind) { closeList(); html += `<${kind}>`; list = kind; }
        html += `<li>${inlineMarkdown(item[1])}</li>`;
      } else {
        closeList(); html += `<p>${inlineMarkdown(trimmed)}</p>`;
      }
    }
    closeList();
    return html;
  }

  const form = document.getElementById('form');
  const question = document.getElementById('question');
  const answer = document.getElementById('answer');
  const meta = document.getElementById('meta');
  const button = form.querySelector('button');

  form.addEventListener('submit', async (event) => {
    event.preventDefault();
    button.disabled = true;
    answer.className = '';
    answer.textContent = 'Запит виконується…';
    meta.textContent = '';

    try {
      const response = await fetch('/api/ask', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ question: question.value }),
      });
      const data = await response.json();

      if (!response.ok) {
        answer.className = 'error';
        answer.textContent = data.detail || `Помилка ${response.status}`;
        return;
      }

      // Склад полів відповіді визначаєте ви — тут показано найочікуваніші.
      answer.innerHTML = renderMarkdown(data.answer ?? JSON.stringify(data, null, 2));
      const parts = [];
      if (data.model) parts.push(`модель: ${data.model}`);
      if (data.elapsed !== undefined) parts.push(`час: ${Number(data.elapsed).toFixed(2)} с`);
      meta.textContent = parts.join(' · ');
    } catch (error) {
      answer.className = 'error';
      answer.textContent = 'Не вдалося звʼязатися із застосунком.';
    } finally {
      button.disabled = false;
    }
  });
</script>
